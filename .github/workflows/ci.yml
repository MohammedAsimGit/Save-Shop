name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      # --- Checkout ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Node.js ---
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --- Dependency installation ---
      - name: Install dependencies
        run: npm ci

      # --- Standard test suite ---
      - name: Run standard tests
        run: npm test

      # --- Typecheck ---
      - name: Run typecheck
        run: npm run typecheck

      # --- Lint ---
      - name: Run lint
        run: npm run lint

      # --- Format check ---
      - name: Run format check
        run: npm run format:check

      # --- Production build ---
      - name: Run build
        run: npm run build

      # --- Replica-set integration tests ---
      - name: Run replica-set integration tests
        run: npm run test:integration:merge
        timeout-minutes: 30
        env:
          NODE_ENV: test
          LOG_LEVEL: silent
          PORT: '4000'
          CORS_ALLOWED_ORIGINS: 'http://localhost:5173,http://127.0.0.1:5173'
